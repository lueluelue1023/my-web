<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>meme图工坊 - 图片文字编辑器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #f8fafc 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* 左侧画布区域 */
        .canvas-section {
            flex: 1;
            min-width: 500px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .canvas-wrapper {
            width: 500px;
            max-width: 100%;
            border: 2px solid #ffe8f0;
            border-radius: 12px;
            overflow: hidden;
            background: #fafafa;
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto;
        }

        .canvas-placeholder {
            width: 500px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 18px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        /* 上传按钮 */
        .upload-area {
            margin-bottom: 20px;
            width: 100%;
        }

        .upload-btn {
            display: inline-flex;
            align-items: center;
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            height: 44px;
        }

        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        .upload-btn input {
            display: none;
        }

        .file-info {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }

        .gallery-btn-inline {
            padding: 12px 24px;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            height: 44px;
            display: inline-flex;
            align-items: center;
        }

        .gallery-btn-inline:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        /* 右侧控制面板 */
        .control-panel {
            width: 280px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
            padding: 20px;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }

        .control-block {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }

        .control-block:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .control-block h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .current-editing {
            background: #fff0f5;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
            color: #c44569;
            font-weight: 500;
        }

        .control-item {
            margin-bottom: 16px;
        }

        .control-item:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #ff6b9d;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #ffe8f0;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b9d;
            cursor: pointer;
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff6b9d;
            cursor: pointer;
            border: none;
        }

        .value-display {
            display: inline-block;
            margin-left: 8px;
            color: #ff6b9d;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="color"] {
            width: 60px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: none;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #ff6b9d;
        }

        .hidden {
            display: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-add {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #666;
            flex: 1;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .btn-export {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        .btn-export:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        .btn-export:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 图库按钮 */
        .gallery-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
            width: 100%;
            margin-bottom: 16px;
        }

        .gallery-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: #faf5f0;
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e8e8e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            border-radius: 16px 16px 0 0;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            line-height: 1;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: #e0e0e0;
        }

        /* 文件夹标签 */
        .folder-tabs {
            padding: 16px 20px;
            background: #faf5f0;
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            gap: 10px;
        }

        .folder-tab {
            padding: 8px 16px;
            border: none;
            background: #e8e8e8;
            color: #666;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .folder-tab:hover {
            background: #d8d8d8;
        }

        .folder-tab.active {
            background: #ff6b9d;
            color: white;
        }

        /* 图片网格 */
        .image-grid {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            background: #faf5f0;
        }

        .grid-item {
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .grid-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        .grid-item-image {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #f0f0f0;
        }

        .grid-item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .grid-item:hover .grid-item-image img {
            transform: scale(1.05);
        }

        .grid-item-loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            background: #f0f0f0;
        }

        .grid-item-name {
            padding: 8px 10px;
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #ffffff;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 16px;
        }

        .error-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: #e74c3c;
            font-size: 16px;
        }

        /* 大图预览模态框 */
        .preview-modal .modal-content {
            max-width: 700px;
        }

        .preview-image {
            text-align: center;
            padding: 20px;
            background: #f0f0f0;
        }

        .preview-image img {
            max-width: 100%;
            max-height: 60vh;
            border-radius: 8px;
        }

        .preview-footer {
            padding: 16px 20px;
            background: #ffffff;
            border-top: 1px solid #e8e8e8;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-use {
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 100%);
            color: white;
        }

        .btn-use:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 157, 0.4);
        }

        /* 占位图 */
        .placeholder-img {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f0f0;
            color: #999;
            font-size: 14px;
        }

        .padding-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* 文本框列表样式 */
        .text-list {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .text-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #f0f0f0;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .text-item:hover {
            background: #e8e8e8;
        }

        .text-item.active {
            background: #4a90e2;
            border-color: #4a90e2;
        }

        .text-item.active .text-item-name {
            color: #ffffff;
        }

        .text-item-name {
            font-size: 14px;
            color: #333;
            font-weight: 500;
            transition: color 0.2s;
        }

        .text-item-delete {
            font-size: 16px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .text-item-delete:hover {
            background: #ffe0e0;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .control-panel {
                width: 100%;
                max-height: none;
            }
            .canvas-section {
                min-width: auto;
                width: 100%;
            }
            .canvas-wrapper {
                max-width: 100%;
            }
        }

        @media (max-width: 768px) {
            .image-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <h1>meme图工坊 ✨</h1>
    <div class="container">
        <!-- 左侧画布区域 -->
        <div class="canvas-section">
            <div class="upload-area">
                <div style="display: flex; gap: 10px; align-items: stretch;">
                    <label class="upload-btn">
                        <input type="file" id="imageUpload" accept="image/jpg,image/jpeg,image/png">
                        📁 点击上传图片
                    </label>
                    <button class="gallery-btn-inline" id="openGalleryBtn">🖼️ 打开图库</button>
                </div>
                <div class="file-info" id="fileInfo"></div>
            </div>
            <div class="canvas-wrapper" id="canvasWrapper">
                <div class="canvas-placeholder" id="canvasPlaceholder">请先上传图片</div>
                <canvas id="canvas" style="display: none;"></canvas>
            </div>
        </div>

        <!-- 右侧控制面板 -->
        <div class="control-panel">
            <!-- 文本框管理 -->
            <div class="control-block">
                <h3>📋 文本框管理</h3>
                <button class="btn-add" id="addTextBtn">+ 添加文本框</button>
                <div class="text-list" id="textList"></div>
            </div>

            <!-- 当前编辑提示 -->
            <div class="current-editing" id="currentEditing">正在编辑：文本框 1</div>

            <!-- 文字内容 -->
            <div class="control-block">
                <h3>📝 文字内容</h3>
                <div class="control-item">
                    <input type="text" id="textContent" value="输入文字">
                </div>
            </div>

            <!-- 文字样式 -->
            <div class="control-block">
                <h3>🎨 文字样式</h3>
                <div class="control-item">
                    <label>
                        文字大小
                        <span class="value-display" id="fontSizeValue">24px</span>
                    </label>
                    <input type="range" id="fontSize" min="12" max="72" value="24">
                </div>
                <div class="control-item">
                    <label>文字颜色</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div class="control-item">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="textBgEnabled">
                        <label for="textBgEnabled">启用文字背景</label>
                    </div>
                </div>
                <div class="control-item" id="textBgControls" style="display: none;">
                    <label>背景颜色</label>
                    <input type="color" id="textBgColor" value="#FF0000">
                </div>
                <div class="control-item" id="textBgPaddingControls" style="display: none;">
                    <label>
                        背景内边距
                        <span class="value-display" id="textBgPaddingValue">5px</span>
                    </label>
                    <input type="range" id="textBgPadding" min="0" max="20" value="5">
                </div>
            </div>

            <!-- 文字位置 -->
            <div class="control-block">
                <h3>📍 文字位置</h3>
                <div class="control-item">
                    <label>
                        X 坐标
                        <span class="value-display" id="xPercentValue">50%</span>
                    </label>
                    <input type="range" id="xPercent" min="0" max="100" value="50">
                </div>
                <div class="control-item">
                    <label>
                        Y 坐标
                        <span class="value-display" id="yPercentValue">50%</span>
                    </label>
                    <input type="range" id="yPercent" min="0" max="100" value="50">
                </div>
                <div class="button-group">
                    <button class="btn-reset" id="resetPosition">重置居中</button>
                </div>
            </div>

            <!-- 留白控制 -->
            <div class="control-block">
                <h3>🪘 留白控制</h3>
                <div class="padding-row">
                    <div class="control-item">
                        <label>
                            上留白
                            <span class="value-display" id="paddingTopValue">0px</span>
                        </label>
                        <input type="range" id="paddingTop" min="0" max="200" value="0">
                    </div>
                    <div class="control-item">
                        <label>
                            下留白
                            <span class="value-display" id="paddingBottomValue">0px</span>
                        </label>
                        <input type="range" id="paddingBottom" min="0" max="200" value="0">
                    </div>
                </div>
                <div class="padding-row" style="margin-top: 12px;">
                    <div class="control-item">
                        <label>
                            左留白
                            <span class="value-display" id="paddingLeftValue">0px</span>
                        </label>
                        <input type="range" id="paddingLeft" min="0" max="200" value="0">
                    </div>
                    <div class="control-item">
                        <label>
                            右留白
                            <span class="value-display" id="paddingRightValue">0px</span>
                        </label>
                        <input type="range" id="paddingRight" min="0" max="200" value="0">
                    </div>
                </div>
            </div>

            <!-- 导出按钮 -->
            <button class="btn-export" id="exportBtn" disabled>💾 导出图片</button>
        </div>
    </div>

    <!-- 图库模态框 -->
    <div class="modal" id="galleryModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">🖼️ 图库</div>
                <button class="modal-close" id="closeGalleryModal">×</button>
            </div>
            <div class="folder-tabs" id="folderTabs">
                <!-- 动态生成标签 -->
            </div>
            <div class="image-grid" id="imageGrid">
                <!-- 动态生成图片 -->
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="modal preview-modal" id="previewModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="previewTitle">图片预览</div>
                <button class="modal-close" id="closePreviewModal">×</button>
            </div>
            <div class="preview-image">
                <img id="previewImg" src="" alt="">
            </div>
            <div class="preview-footer">
                <button class="btn-cancel" id="cancelPreview">取消</button>
                <button class="btn-use" id="useImageBtn">应用</button>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const imageUpload = document.getElementById('imageUpload');
        const fileInfo = document.getElementById('fileInfo');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const canvasPlaceholder = document.getElementById('canvasPlaceholder');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const exportBtn = document.getElementById('exportBtn');
        const addTextBtn = document.getElementById('addTextBtn');
        const textList = document.getElementById('textList');
        const currentEditing = document.getElementById('currentEditing');

        // 控制面板元素
        const textContent = document.getElementById('textContent');
        const fontSize = document.getElementById('fontSize');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const textColor = document.getElementById('textColor');
        const textBgEnabled = document.getElementById('textBgEnabled');
        const textBgControls = document.getElementById('textBgControls');
        const textBgColor = document.getElementById('textBgColor');
        const textBgPadding = document.getElementById('textBgPadding');
        const textBgPaddingValue = document.getElementById('textBgPaddingValue');
        const textBgPaddingControls = document.getElementById('textBgPaddingControls');
        const xPercent = document.getElementById('xPercent');
        const xPercentValue = document.getElementById('xPercentValue');
        const yPercent = document.getElementById('yPercent');
        const yPercentValue = document.getElementById('yPercentValue');
        const resetPosition = document.getElementById('resetPosition');
        const paddingTop = document.getElementById('paddingTop');
        const paddingTopValue = document.getElementById('paddingTopValue');
        const paddingBottom = document.getElementById('paddingBottom');
        const paddingBottomValue = document.getElementById('paddingBottomValue');
        const paddingLeft = document.getElementById('paddingLeft');
        const paddingLeftValue = document.getElementById('paddingLeftValue');
        const paddingRight = document.getElementById('paddingRight');
        const paddingRightValue = document.getElementById('paddingRightValue');

        // 全局变量
        let originalImage = null;
        let hasImage = false;
        let textBoxes = [];
        let currentTextId = null;
        let nextId = 1;

        // 初始化事件监听
        function init() {
            // 创建第一个默认文本框
            addTextBox();

            // 图片上传
            imageUpload.addEventListener('change', handleImageUpload);

            // 添加文本框按钮
            addTextBtn.addEventListener('click', addTextBox);

            // 文字内容变化
            textContent.addEventListener('input', () => {
                updateCurrentText('content', textContent.value);
                redraw();
            });

            // 文字大小变化
            fontSize.addEventListener('input', () => {
                fontSizeValue.textContent = fontSize.value + 'px';
                updateCurrentText('fontSize', parseInt(fontSize.value));
                redraw();
            });

            // 文字颜色变化
            textColor.addEventListener('input', () => {
                updateCurrentText('color', textColor.value);
                redraw();
            });

            // 文字背景开关
            textBgEnabled.addEventListener('change', () => {
                updateCurrentText('bgEnabled', textBgEnabled.checked);
                if (textBgEnabled.checked) {
                    textBgControls.style.display = 'block';
                    textBgPaddingControls.style.display = 'block';
                } else {
                    textBgControls.style.display = 'none';
                    textBgPaddingControls.style.display = 'none';
                }
                redraw();
            });

            // 文字背景颜色
            textBgColor.addEventListener('input', () => {
                updateCurrentText('bgColor', textBgColor.value);
                redraw();
            });

            // 文字背景内边距
            textBgPadding.addEventListener('input', () => {
                textBgPaddingValue.textContent = textBgPadding.value + 'px';
                updateCurrentText('bgPadding', parseInt(textBgPadding.value));
                redraw();
            });

            // X坐标变化
            xPercent.addEventListener('input', () => {
                xPercentValue.textContent = xPercent.value + '%';
                updateCurrentText('x', parseInt(xPercent.value));
                redraw();
            });

            // Y坐标变化
            yPercent.addEventListener('input', () => {
                yPercentValue.textContent = yPercent.value + '%';
                updateCurrentText('y', parseInt(yPercent.value));
                redraw();
            });

            // 重置位置
            resetPosition.addEventListener('click', () => {
                xPercent.value = 50;
                yPercent.value = 50;
                xPercentValue.textContent = '50%';
                yPercentValue.textContent = '50%';
                updateCurrentText('x', 50);
                updateCurrentText('y', 50);
                redraw();
            });

            // 留白控制
            paddingTop.addEventListener('input', () => {
                paddingTopValue.textContent = paddingTop.value + 'px';
                redraw();
            });
            paddingBottom.addEventListener('input', () => {
                paddingBottomValue.textContent = paddingBottom.value + 'px';
                redraw();
            });
            paddingLeft.addEventListener('input', () => {
                paddingLeftValue.textContent = paddingLeft.value + 'px';
                redraw();
            });
            paddingRight.addEventListener('input', () => {
                paddingRightValue.textContent = paddingRight.value + 'px';
                redraw();
            });

            // 导出按钮
            exportBtn.addEventListener('click', exportImage);
        }

        // 添加新文本框
        function addTextBox() {
            const newBox = {
                id: 'text_' + nextId,
                content: '输入文字',
                fontSize: 24,
                color: '#000000',
                bgEnabled: false,
                bgColor: '#FF0000',
                bgPadding: 5,
                x: 50,
                y: 50
            };
            textBoxes.push(newBox);
            nextId++;
            renderTextList();
            selectText(newBox.id);
            redraw();
        }

        // 渲染文本框列表
        function renderTextList() {
            textList.innerHTML = '';
            textBoxes.forEach((box, index) => {
                const item = document.createElement('div');
                item.className = 'text-item' + (box.id === currentTextId ? ' active' : '');
                item.innerHTML = `
                    <span class="text-item-name">文本框 ${index + 1}</span>
                    <span class="text-item-delete" data-id="${box.id}">🗑️</span>
                `;
                item.addEventListener('click', () => selectText(box.id));
                item.querySelector('.text-item-delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteText(box.id);
                });
                textList.appendChild(item);
            });
        }

        // 选择文本框
        function selectText(id) {
            currentTextId = id;
            const box = getCurrentText();
            if (!box) return;

            // 更新控制面板显示当前编辑
            const index = textBoxes.findIndex(b => b.id === id) + 1;
            currentEditing.textContent = `正在编辑：文本框 ${index}`;

            // 更新控件值
            textContent.value = box.content;
            fontSize.value = box.fontSize;
            fontSizeValue.textContent = box.fontSize + 'px';
            textColor.value = box.color;
            textBgEnabled.checked = box.bgEnabled;
            textBgColor.value = box.bgColor;
            textBgPadding.value = box.bgPadding;
            textBgPaddingValue.textContent = box.bgPadding + 'px';
            xPercent.value = box.x;
            xPercentValue.textContent = box.x + '%';
            yPercent.value = box.y;
            yPercentValue.textContent = box.y + '%';

            if (box.bgEnabled) {
                textBgControls.style.display = 'block';
                textBgPaddingControls.style.display = 'block';
            } else {
                textBgControls.style.display = 'none';
                textBgPaddingControls.style.display = 'none';
            }

            renderTextList();
        }

        // 删除文本框
        function deleteText(id) {
            // 至少保留一个文本框
            if (textBoxes.length <= 1) {
                alert('至少保留一个文本框');
                return;
            }

            const index = textBoxes.findIndex(box => box.id === id);
            textBoxes.splice(index, 1);

            // 如果删除的是当前选中的，选中第一个
            if (id === currentTextId) {
                selectText(textBoxes[0].id);
            }

            renderTextList();
            redraw();
        }

        // 获取当前文本框
        function getCurrentText() {
            return textBoxes.find(box => box.id === currentTextId);
        }

        // 更新当前文本框的属性
        function updateCurrentText(key, value) {
            const box = getCurrentText();
            if (box) {
                box[key] = value;
            }
        }

        // 处理图片上传
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (!['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)) {
                alert('请上传 JPG 或 PNG 格式的图片');
                return;
            }

            fileInfo.textContent = `已上传: ${file.name}`;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    originalImage = img;
                    hasImage = true;
                    canvasPlaceholder.style.display = 'none';
                    canvas.style.display = 'block';
                    exportBtn.disabled = false;
                    redraw();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 重绘画布
        function redraw() {
            if (!hasImage || !originalImage) return;

            // 获取当前参数
            const pTop = parseInt(paddingTop.value);
            const pBottom = parseInt(paddingBottom.value);
            const pLeft = parseInt(paddingLeft.value);
            const pRight = parseInt(paddingRight.value);

            // 计算新画布尺寸
            const canvasWidth = originalImage.width + pLeft + pRight;
            const canvasHeight = originalImage.height + pTop + pBottom;

            // 设置画布尺寸
            canvas.width = canvasWidth;
            canvas.height = canvasHeight;

            // 1. 清空画布，绘制白色背景
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvasWidth, canvasHeight);

            // 2. 绘制原图
            ctx.drawImage(originalImage, pLeft, pTop);

            // 3. 遍历所有文本框，按顺序绘制（先添加的在下，后添加的在上）
            textBoxes.forEach(box => {
                const text = box.content.trim();
                if (text.length > 0) {
                    drawSingleText(box, canvasWidth, canvasHeight);
                }
            });
        }

        // 绘制单个文本框
        function drawSingleText(box, canvasWidth, canvasHeight) {
            const fSize = box.fontSize;
            const tColor = box.color;
            const hasBg = box.bgEnabled;
            const bgColor = box.bgColor;
            const bgPadding = box.bgPadding;
            const xPct = box.x;
            const yPct = box.y;

            // 设置字体
            ctx.font = fSize + 'px sans-serif';
            ctx.textBaseline = 'top';

            // 测量文字尺寸
            const metrics = ctx.measureText(box.content);
            const textWidth = metrics.width;
            const textHeight = fSize; // 近似值

            // 计算文字位置
            let textX, textY;

            if (xPct === 0) {
                textX = 0;
            } else if (xPct === 100) {
                textX = canvasWidth - textWidth;
            } else {
                textX = (xPct / 100) * canvasWidth;
            }

            if (yPct === 0) {
                textY = 0;
            } else if (yPct === 100) {
                textY = canvasHeight - textHeight;
            } else {
                textY = (yPct / 100) * canvasHeight;
            }

            // 如果开启背景，先画背景
            if (hasBg) {
                const bgX = textX - bgPadding;
                const bgY = textY - bgPadding;
                const bgW = textWidth + bgPadding * 2;
                const bgH = textHeight + bgPadding * 2;

                ctx.fillStyle = bgColor;
                ctx.fillRect(bgX, bgY, bgW, bgH);
            }

            // 绘制文字
            ctx.fillStyle = tColor;
            ctx.fillText(box.content, textX, textY);
        }

        // 导出图片
        function exportImage() {
            if (!hasImage) return;

            const timestamp = Date.now();
            const fileName = `wenantu_${timestamp}.png`;

            // 创建下载链接
            const link = document.createElement('a');
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // 初始化
        init();

        // ========== 图库功能 ==========

        // GitHub 配置
        const GITHUB_CONFIG = {
          owner: 'lueluelue1023',
          repo: 'meme',
          branch: 'main',
          folders: ['百家讲坛','meme']
        };

        // 图库模态框元素
        const galleryModal = document.getElementById('galleryModal');
        const previewModal = document.getElementById('previewModal');
        const openGalleryBtn = document.getElementById('openGalleryBtn');
        const closeGalleryModal = document.getElementById('closeGalleryModal');
        const closePreviewModal = document.getElementById('closePreviewModal');
        const cancelPreview = document.getElementById('cancelPreview');
        const useImageBtn = document.getElementById('useImageBtn');
        const folderTabs = document.getElementById('folderTabs');
        const imageGrid = document.getElementById('imageGrid');
        const previewImg = document.getElementById('previewImg');
        const previewTitle = document.getElementById('previewTitle');

        // 当前状态
        let currentFolder = null;
        let selectedImage = null;
        let selectedImageUrl = null;

        // 打开图库
        openGalleryBtn.addEventListener('click', () => {
            galleryModal.classList.add('show');
            if (!currentFolder && GITHUB_CONFIG.folders.length > 0) {
                renderFolderTabs();
                loadFolderImages(GITHUB_CONFIG.folders[0]);
            }
        });

        // 关闭图库
        closeGalleryModal.addEventListener('click', () => {
            galleryModal.classList.remove('show');
        });

        // 点击模态框背景关闭
        galleryModal.addEventListener('click', (e) => {
            if (e.target === galleryModal) {
                galleryModal.classList.remove('show');
            }
        });

        // 关闭预览
        function closePreview() {
            previewModal.classList.remove('show');
        }

        closePreviewModal.addEventListener('click', closePreview);
        cancelPreview.addEventListener('click', closePreview);
        previewModal.addEventListener('click', (e) => {
            if (e.target === previewModal) {
                closePreview();
            }
        });

        // 渲染文件夹标签
        function renderFolderTabs() {
            folderTabs.innerHTML = '';
            GITHUB_CONFIG.folders.forEach(folder => {
                const tab = document.createElement('button');
                tab.className = 'folder-tab' + (folder === GITHUB_CONFIG.folders[0] ? ' active' : '');
                tab.textContent = folder;
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.folder-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadFolderImages(folder);
                });
                folderTabs.appendChild(tab);
            });
        }

        // 加载文件夹图片
        async function loadFolderImages(folder) {
            currentFolder = folder;
            imageGrid.innerHTML = '<div class="empty-state">加载中...</div>';

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${folder}?ref=${GITHUB_CONFIG.branch}`;

                const response = await fetch(apiUrl, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'X-GitHub-Api-Version': '2026-03-10'
                    }
                });

                if (!response.ok) {
                    throw new Error('API 请求失败');
                }

                const data = await response.json();

                // 筛选图片文件
                const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.webp'];
                const images = data.filter(item => {
                    if (item.type !== 'file') return false;
                    const dotIndex = item.name.lastIndexOf('.');
                    if (dotIndex === -1) return false;
                    const ext = item.name.toLowerCase().slice(dotIndex);
                    return imageExtensions.includes(ext);
                });

                if (images.length === 0) {
                    imageGrid.innerHTML = '<div class="empty-state">暂无图片</div>';
                    return;
                }

                // 渲染图片网格
                imageGrid.innerHTML = '';
                images.forEach(img => {
                    const cdnUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${folder}/${img.name}`;
                    const gridItem = createImageGridItem(img.name, cdnUrl);
                    imageGrid.appendChild(gridItem);
                });

            } catch (error) {
                console.error('加载图片失败:', error);
                imageGrid.innerHTML = '<div class="error-state">加载失败，请刷新重试</div>';
            }
        }

        // 创建图片网格项
        function createImageGridItem(name, url) {
            const item = document.createElement('div');
            item.className = 'grid-item';

            const imageContainer = document.createElement('div');
            imageContainer.className = 'grid-item-image';

            const loading = document.createElement('div');
            loading.className = 'grid-item-loading';
            loading.textContent = '加载中...';

            const img = document.createElement('img');
            img.style.display = 'none';
            img.onload = () => {
                loading.style.display = 'none';
                img.style.display = 'block';
            };
            img.onerror = () => {
                loading.style.display = 'none';
                const placeholder = document.createElement('div');
                placeholder.className = 'placeholder-img';
                placeholder.textContent = '加载失败';
                imageContainer.appendChild(placeholder);
            };
            img.src = url;

            imageContainer.appendChild(loading);
            imageContainer.appendChild(img);

            const nameDiv = document.createElement('div');
            nameDiv.className = 'grid-item-name';
            nameDiv.textContent = name;

            item.appendChild(imageContainer);
            item.appendChild(nameDiv);

            // 点击打开预览
            item.addEventListener('click', () => {
                openPreview(name, url);
            });

            return item;
        }

        // 打开图片预览
        function openPreview(name, url) {
            selectedImage = name;
            selectedImageUrl = url;
            previewTitle.textContent = name;
            previewImg.src = url;
            previewModal.classList.add('show');
        }

        // 使用此图
        useImageBtn.addEventListener('click', () => {
            if (!selectedImageUrl) return;

            // 加载图片到画布
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                originalImage = img;
                hasImage = true;
                canvasPlaceholder.style.display = 'none';
                canvas.style.display = 'block';
                exportBtn.disabled = false;
                redraw();
                fileInfo.textContent = `已选择: ${selectedImage}`;
            };
            img.onerror = function() {
                alert('图片加载失败，请尝试其他图片');
            };
            img.src = selectedImageUrl;

            // 关闭模态框
            closePreview();
            galleryModal.classList.remove('show');
        });
    </script>
</body>
</html>
